<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>P.E.E.S.I</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #edeeef;
            color: #333;
        }

        header {
            background: #6f8d3e;
            padding: 35px 20px;
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            text-align: center;
            padding: 20px;
        }

        .intro {
            font-size: 18px;
            margin-bottom: 40px;
            color: #444;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            font-size: 18px;
            background: white;
            color: #6f889c;
            border: 2px solid #6f889c;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.25s;
        }

        .btn:hover {
            background: #6f889c;
            color: white;
        }

        /* QUIZ PAGE STYLE */
        #quizContainer {
            display: none;
            margin-top: 40px;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .quiz-question {
            margin-bottom: 18px;
            font-weight: bold;
            color: #6f889c;
        }

        .quiz-option {
            display: block;
            text-align: left;
            padding: 10px;
            margin: 8px 0;
            background: #f7f7f7;
            border: 2px solid #6f889c;
            border-radius: 10px;
            cursor: pointer;
        }

        .resultado {
            margin-top: 20px;
            padding: 12px;
            border-left: 5px solid #6f8d3e;
            background: #f0f0f0;
        }
    </style>
</head>

<body>

<header>
    Plataforma de Educação Energética com Simulações Interativas
</header>

<div class="container">

    <p class="intro">
        Bem-vindo(a) à P.E.E.S.I! Explore conteúdos energéticos de forma interativa:  
        escolha entre jogar uma simulação feita no Unity ou testar seus conhecimentos no quiz básico.
    </p>

    <div class="botoes">
        <!-- Troque o link depois para o seu jogo Unity -->
        <a class="btn" href="SEU-LINK-DO-UNITY-AQUI">🎮 Jogar (Unity)</a>

        <button class="btn" onclick="abrirQuiz()">📝 Fazer Quiz</button>
    </div>

    
    <!-- QUIZ -->
    <div id="quizContainer">
        <h2 style="color:#6f889c;">Quiz de 4 Perguntas</h2>

        <div id="quizContent"></div>
        <div id="resultadoFinal"></div>
    </div>

</div>

<script>
/* QUIZ LOGIC */
const perguntas = [
    {
        pergunta: "1) O que é energia elétrica?",
        opcoes: ["A) Movimento de elétrons", "B) Movimento de prótons", "C) Luz solar concentrada"],
        correta: 0
    },
    {
        pergunta: "2) Qual item consome mais energia?",
        opcoes: ["A) Ventilador", "B) Secador de cabelo", "C) Carregador de celular"],
        correta: 1
    },
    {
        pergunta: "3) O que ajuda a economizar energia?",
        opcoes: ["A) Apagar luzes quando possível", "B) Deixar a TV ligada", "C) Usar aparelhos velhos e ineficientes"],
        correta: 0
    },
    {
        pergunta: "4) Energia solar funciona melhor em qual situação?",
        opcoes: ["A) Dia ensolarado", "B) Noite", "C) Tempestade forte"],
        correta: 0
    },
];

let index = 0;
let acertos = 0;

function abrirQuiz() {
    document.getElementById("quizContainer").style.display = "block";
    mostrarPergunta();
}

function mostrarPergunta() {
    const q = perguntas[index];
    const box = document.getElementById("quizContent");

    box.innerHTML = `
        <p class="quiz-question">${q.pergunta}</p>
        ${q.opcoes.map((op, i) =>
            `<div class="quiz-option" onclick="responder(${i})">${op}</div>`
        ).join("")}
    `;
}

function responder(resposta) {
    if (resposta === perguntas[index].correta) acertos++;

    index++;

    if (index < perguntas.length) {
        mostrarPergunta();
    } else {
        finalizarQuiz();
    }
}

function finalizarQuiz() {
    document.getElementById("quizContent").innerHTML = "";
    document.getElementById("resultadoFinal").innerHTML = `
        <div class="resultado">
            Você acertou <strong>${acertos}</strong> de <strong>${perguntas.length}</strong> perguntas! 🎉
        </div>
    `;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>P.E.E.S.I</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #edeeef;
            color: #333;
        }

        header {
            background: #6f8d3e;
            padding: 35px 20px;
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            text-align: center;
            padding: 20px;
        }

        .intro {
            font-size: 18px;
            margin-bottom: 40px;
            color: #444;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            font-size: 18px;
            background: white;
            color: #6f889c;
            border: 2px solid #6f889c;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.25s;
        }

        .btn:hover {
            background: #6f889c;
            color: white;
        }

        /* QUIZ PAGE STYLE */
        #quizContainer {
            display: none;
            margin-top: 40px;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .quiz-question {
            margin-bottom: 18px;
            font-weight: bold;
            color: #6f889c;
        }

        .quiz-option {
            display: block;
            text-align: left;
            padding: 10px;
            margin: 8px 0;
            background: #f7f7f7;
            border: 2px solid #6f889c;
            border-radius: 10px;
            cursor: pointer;
        }

        .resultado {
            margin-top: 20px;
            padding: 12px;
            border-left: 5px solid #6f8d3e;
            background: #f0f0f0;
        }
    </style>
</head>

<body>

<header>
    Plataforma de Educação Energética com Simulações Interativas
</header>

<div class="container">

    <p class="intro">
        Bem-vindo(a) à P.E.E.S.I! Explore conteúdos energéticos de forma interativa:  
        escolha entre jogar uma simulação ou testar seus conhecimentos no quiz.
    </p>

    <div class="botoes">
        <!-- Troque o link depois para o seu jogo Unity -->
        <a class="btn" href="SEU-LINK-DO-UNITY-AQUI">🎮 Jogar Simulação</a>

        <button class="btn" onclick="abrirQuiz()">📝 Fazer Quiz</button>
    </div>

    
    <!-- QUIZ -->
    <div id="quizContainer">
        <h2 style="color:#6f889c;">Quiz de 6 Perguntas</h2>

        <div id="quizContent"></div>
        <div id="resultadoFinal"></div>
    </div>

</div>

<script>
/* QUIZ LOGIC */
const perguntas = [
    {
        pergunta: "1) Em uma residência, vários aparelhos permanecem ligados na tomada mesmo quando não estão em uso. Esse hábito contribui para o aumento da conta de energia porque:",
        opcoes: ["A) alguns dispositivos continuam consumindo energia em modo stand-by.", "B) aparelhos desligados reduzem a eficiência da rede elétrica.", "C) a rede precisa compensar a tensão perdida pelo desuso."],
        correta: 0
    },
    {
        pergunta: "2) Substituir lâmpadas fluorescentes por lâmpadas LED é uma prática recomendada porque:",
        opcoes: ["A) LEDs consomem mais energia, mas iluminam melhor.", "B) LEDs têm maior vida útil e menor consumo energético.", "C) LEDs transformam mais energia em calor que luz."],
        correta: 1
    },
    {
        pergunta: "3) O que ajuda a economizar energia?",
        opcoes: ["A) Apagar luzes quando possível", "B) Abrir a geladeira várias vezes ao dia para estabilizar a temperatura interna.", "C) Utilizar o ar-condicionado no modo 'turbo' para resfriar o ambiente mais rápido."],
        correta: 0
    },
    {
        pergunta: "4) A energia solar é considerada uma fonte renovável porque:",
        opcoes: ["A) possui alto impacto ambiental comparado a outras fontes.", "B) produz resíduos tóxicos durante sua geração", "C) utiliza uma fonte natural inesgotável a longo prazo."],
        correta: 2
    },
    {
        pergunta: "5) Em uma residência, uma pessoa recebe um choque ao tocar um eletrodoméstico metálico. Considerando os princípios da segurança elétrica, por que essa situação ocorre?",
        opcoes: ["A) Porque o metal esquenta e libera eletricidade quando o aparelho está ligado.", "B) Porque o corpo humano sempre conduz energia quando encosta em qualquer aparelho.", "C) Porque a carcaça metálica pode estar energizada devido a falha no aterramento ou isolamento."],
        correta: 2
    },
    {
        pergunta: "6) Em uma residência, vários equipamentos de alta potência são conectados na mesma extensão elétrica. Do ponto de vista elétrico, essa situação representa risco porque:",
        opcoes: ["A) vários aparelhos juntos diminuem o consumo de energia, esquentando a extensão.", "B) o excesso de corrente pode elevar a temperatura dos condutores acima da capacidade de dissipação térmica, degradando o isolamento e iniciando combustão.", "C) a soma das potências faz com que a tensão da rede aumente, o que leva ao superaquecimento natural das tomadas."],
        correta: 1
    },
];

let index = 0;
let acertos = 0;

function abrirQuiz() {
    document.getElementById("quizContainer").style.display = "block";
    mostrarPergunta();
}

function mostrarPergunta() {
    const q = perguntas[index];
    const box = document.getElementById("quizContent");

    box.innerHTML = `
        <p class="quiz-question">${q.pergunta}</p>
        ${q.opcoes.map((op, i) =>
            `<div class="quiz-option" onclick="responder(${i})">${op}</div>`
        ).join("")}
    `;
}

function responder(resposta) {
    if (resposta === perguntas[index].correta) acertos++;

    index++;

    if (index < perguntas.length) {
        mostrarPergunta();
    } else {
        finalizarQuiz();
    }
}

function finalizarQuiz() {
    document.getElementById("quizContent").innerHTML = "";
    document.getElementById("resultadoFinal").innerHTML = `
        <div class="resultado">
            Você acertou <strong>${acertos}</strong> de <strong>${perguntas.length}</strong> perguntas! 🎉
        </div>
    `;
}
</script>

</body>
</html>

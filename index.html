<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>P.E.E.S.I</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #edeeef;
            color: #333;
        }

        header {
            background: #6f8d3e;
            padding: 25px;
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        section {
            padding: 60px 20px;
            margin: 40px auto;
            max-width: 1000px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        h2 {
            margin-top: 0;
            color: #6f889c;
        }

        /* --- CASA E CLIMA --- */
        .casa-container {
            text-align: center;
            position: relative;
        }

        .icone-clima {
            font-size: 46px;
            position: absolute;
            top: 10px;
            right: 20px;
        }

        .casa {
            font-size: 130px;
            margin-top: 40px;
        }

        .botoes-clima button {
            margin: 10px;
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: #6f889c;
            color: white;
            cursor: pointer;
        }

        /* --- SIMULAÇÃO CIRCUITO --- */
        .circuito-box {
            padding: 25px;
            border: 2px solid #6f889c;
            border-radius: 14px;
            text-align: center;
        }

        .lampada {
            font-size: 70px;
            margin-top: 20px;
            transition: 0.3s;
        }

        .botao-sim {
            padding: 10px 18px;
            margin-top: 20px;
            background: #6f8d3e;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* --- QUIZ --- */
        .quiz button {
            display: block;
            width: 100%;
            text-align: left;
            margin: 8px 0;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #6f889c;
            background: #f8f8f8;
            cursor: pointer;
        }

        .resultado {
            margin-top: 20px;
            padding: 12px;
            border-left: 5px solid #6f8d3e;
            background: #f4f4f4;
        }
    </style>
</head>

<body>

<header>Plataforma de Educação Energética com Simulações Interativas</header>

<!-- SEÇÃO 1 — CASA E CLIMA -->
<section>
    <h2>Clima & Energia Solar</h2>

    <div class="casa-container">
        <div id="iconeClima" class="icone-clima">☀️</div>
        <div class="casa">🏠</div>

        <div class="botoes-clima">
            <button onclick="mudarClima('sol')">☀️ Ensolarado</button>
            <button onclick="mudarClima('nublado')">⛅ Nublado</button>
            <button onclick="mudarClima('noite')">🌙 Noite</button>
        </div>
    </div>
</section>

<!-- SEÇÃO 2 — SIMULAÇÃO CIRCUITO -->
<section>
    <h2>Simulação de Circuito Elétrico</h2>

    <div class="circuito-box">
        <p>Ative a chave para acender a lâmpada!</p>

        <button class="botao-sim" onclick="toggleLampada()">
            Ligar / Desligar
        </button>

        <div id="lampada" class="lampada" style="opacity:0.3;">💡</div>
    </div>
</section>

<!-- SEÇÃO 3 — QUIZ -->
<section>
    <h2>Quiz: Conceitos Básicos</h2>

    <p>Qual componente controla o acionamento da lâmpada?</p>

    <div class="quiz">
        <button onclick="responder('A')">A) Chave</button>
        <button onclick="responder('B')">B) Bateria</button>
        <button onclick="responder('C')">C) Lâmpada</button>
    </div>

    <div id="resultadoQuiz"></div>
</section>

<script>
/* --- CLIMA --- */
function mudarClima(tipo) {
    const icone = document.getElementById('iconeClima');

    if (tipo === 'sol') icone.textContent = "☀️";
    if (tipo === 'nublado') icone.textContent = "⛅";
    if (tipo === 'noite') icone.textContent = "🌙";
}

/* --- LÂMPADA --- */
let ligada = false;

function toggleLampada() {
    ligada = !ligada;
    document.getElementById("lampada").style.opacity = ligada ? "1" : "0.3";
}

/* --- QUIZ --- */
function responder(opcao) {
    const box = document.getElementById("resultadoQuiz");

    if (opcao === 'A') {
        box.innerHTML =
            "<div class='resultado'><strong>✔ Correto!</strong> A chave controla o acionamento.</div>";
    } else {
        box.innerHTML =
            "<div class='resultado'><strong>✘ Resposta incorreta.</strong> A correta é A) Chave.</div>";
    }
}
</script>

</body>
</html>

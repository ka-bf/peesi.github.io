<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>P.E.E.S.I</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #edeeef;
        }

        header {
            background: #6f8d3e;
            padding: 20px;
            color: white;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
        }

        .section {
            background: white;
            width: 90%;
            max-width: 1200px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 12px;
            display: flex;
            gap: 25px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        }

        .left {
            width: 55%;
        }

        .right {
            width: 45%;
        }

        h2 {
            color: #6f889c;
            margin-top: 0;
        }

   import { useState } from "react";

export default function App() {
  const [quizAnswer, setQuizAnswer] = useState(null);
  const [switchOn, setSwitchOn] = useState(false);

  return (
    <div className="min-h-screen bg-sky-100 p-6 flex flex-col items-center relative">
      {/* Céu + Ícones do clima */}
      <div className="w-full h-40 bg-sky-300 rounded-2xl shadow relative">
        <div className="absolute top-4 right-4 flex gap-3 text-3xl">
          <span>☀️</span>
          <span>🌧️</span>
          <span>⛅</span>
        </div>
      </div>

      {/* Título */}
      <h1 className="text-3xl font-bold mt-6">Simulação + Quiz Básico</h1>

      {/* Simulação do circuito (lâmpada simples) */}
      <div className="mt-10 bg-white p-6 rounded-2xl shadow w-full max-w-xl">
        <h2 className="text-xl font-semibold mb-4">Simulação: Circuito de Lâmpada</h2>

        <div className="flex items-center justify-between p-4 border rounded-xl">
          {/* Chave */}
          <button
            onClick={() => setSwitchOn(!switchOn)}
            className="px-4 py-2 rounded-xl border shadow hover:bg-gray-100"
          >
            {switchOn ? "Desligar" : "Ligar"}
          </button>

          {/* Fio → Lâmpada */}
          <div className="flex items-center gap-4">
            <div className="h-1 w-16 bg-gray-600" />
            <div className={`text-4xl ${switchOn ? "opacity-100" : "opacity-30"}`}>
              💡
            </div>
          </div>
        </div>
      </div>

      {/* Quiz */}
      <div className="mt-10 bg-white p-6 rounded-2xl shadow w-full max-w-xl">
        <h2 className="text-xl font-semibold mb-4">Quiz Rápido</h2>

        <p className="mb-4">Qual componente controla o acionamento da lâmpada?</p>

        <div className="flex flex-col gap-3">
          <button
            onClick={() => setQuizAnswer("switch")}
            className="px-4 py-2 border rounded-xl hover:bg-gray-100 text-left"
          >
            A) Chave
          </button>

          <button
            onClick={() => setQuizAnswer("battery")}
            className="px-4 py-2 border rounded-xl hover:bg-gray-100 text-left"
          >
            B) Bateria
          </button>

          <button
            onClick={() => setQuizAnswer("lamp")}
            className="px-4 py-2 border rounded-xl hover:bg-gray-100 text-left"
          >
            C) Lâmpada
          </button>
        </div>

        {/* Resultado abaixo (sem popup) */}
        {quizAnswer && (
          <div className="mt-4 p-3 border-l-4 rounded bg-gray-50">
            {quizAnswer === "switch" ? (
              <p className="text-green-700 font-semibold">✔ A resposta correta é: Chave</p>
            ) : (
              <p className="text-red-700 font-semibold">✘ Resposta incorreta. A correta é "Chave".</p>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

</script>

</body>
</html>
